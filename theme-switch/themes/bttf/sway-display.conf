# Dual-monitor wallpaper — theme: bttf (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/backtothefuture.jpg

output * bg $wallpaper fill #0b0a21
output DP-2 bg $wallpaper fill #0b0a21
output HDMI-A-1 bg $wallpaper fill #0b0a21

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
