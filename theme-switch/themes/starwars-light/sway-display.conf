# Dual-monitor wallpaper — theme: starwars-light (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/tiefighter.jpg

output * bg $wallpaper fill #f0f4f7
output DP-2 bg $wallpaper fill #f0f4f7
output HDMI-A-1 bg $wallpaper fill #f0f4f7

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
