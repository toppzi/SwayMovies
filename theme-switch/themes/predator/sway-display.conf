# Dual-monitor wallpaper — theme: predator (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/predator.jpg

output * bg $wallpaper fill #101a13
output DP-2 bg $wallpaper fill #101a13
output HDMI-A-1 bg $wallpaper fill #101a13

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
