# Dual-monitor wallpaper — theme: bikermice (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/bikermice.jpg

output * bg $wallpaper fill #111115
output DP-2 bg $wallpaper fill #111115
output HDMI-A-1 bg $wallpaper fill #111115

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
