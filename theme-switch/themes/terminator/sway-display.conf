# Dual-monitor wallpaper — theme: terminator (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/wallhaven_w89pvq.jpg

output * bg $wallpaper fill #0c1317
output DP-2 bg $wallpaper fill #0c1317
output HDMI-A-1 bg $wallpaper fill #0c1317

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
