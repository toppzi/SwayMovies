# Dual-monitor wallpaper — theme: starwars (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/star_wars.jpg

output * bg $wallpaper fill #2f0504
output DP-2 bg $wallpaper fill #2f0504
output HDMI-A-1 bg $wallpaper fill #2f0504

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
