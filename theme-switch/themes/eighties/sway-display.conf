# Dual-monitor wallpaper — theme: eighties (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/eighties.jpg

output * bg $wallpaper fill #1f1b24
output DP-2 bg $wallpaper fill #1f1b24
output HDMI-A-1 bg $wallpaper fill #1f1b24

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
