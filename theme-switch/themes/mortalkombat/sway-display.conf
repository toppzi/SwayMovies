# Dual-monitor wallpaper — theme: mortalkombat (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/Mortalkombat.png

output * bg $wallpaper fill #000000
output DP-2 bg $wallpaper fill #000000
output HDMI-A-1 bg $wallpaper fill #000000

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
