# Dual-monitor wallpaper — theme: tmnt (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/turtles1.jpg

output * bg $wallpaper fill #191c28
output DP-2 bg $wallpaper fill #191c28
output HDMI-A-1 bg $wallpaper fill #191c28

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
