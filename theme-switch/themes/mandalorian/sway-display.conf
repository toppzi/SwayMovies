# Dual-monitor wallpaper — theme: mandalorian (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/mandalorian.jpg

output * bg $wallpaper fill #0b0707
output DP-2 bg $wallpaper fill #0b0707
output HDMI-A-1 bg $wallpaper fill #0b0707

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
