# Dual-monitor wallpaper — theme: knightrider (managed by theme-switch)

set $wallpaper @HOME@/Pictures/Wallpapers/knightrider.png

output * bg $wallpaper fill #08061c
output DP-2 bg $wallpaper fill #08061c
output HDMI-A-1 bg $wallpaper fill #08061c

exec_always --no-startup-id @HOME@/.config/sway/wallpaper-restore.sh
