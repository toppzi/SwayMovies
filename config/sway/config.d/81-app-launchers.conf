# Launch daily apps on the right workspace (see 80-workspace-apps.conf)
set $launch /home/toppzi/.config/sway/launch-on-ws.sh

bindsym $mod+b exec $launch 2 firefox
bindsym $mod+Shift+b exec $launch 2 firefox --private-window
bindsym $mod+Shift+f exec $launch 1 thunar
bindsym $mod+Shift+d exec $launch 5 vesktop
bindsym $mod+g exec $launch 4 /home/toppzi/.local/bin/steam-with-chat
