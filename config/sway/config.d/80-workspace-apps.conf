# Application → workspace (matches Waybar labels)
#   1 Main   (DP-2)     — files, office, settings
#   2 Media  (HDMI-A-1) — browser, video, music
#   3 Dev    (DP-2)     — editors (75-dev-workspace.conf)
#   4 Games  (DP-2)     — Steam, Lutris, launchers
#   5 Chat   (HDMI-A-1) — Discord, Slack, Telegram
#   6 Misc   — optional overflow
# Reload: Super+Shift+c

workspace 4 output DP-2
workspace 5 output HDMI-A-1

# --- 1 Main ---
assign [app_id="thunar"] workspace number 1
assign [class="Thunar"] workspace number 1
for_window [app_id="thunar"] move container to workspace number 1

assign [app_id="org.gnome.Nautilus"] workspace number 1
assign [app_id="org.kde.dolphin"] workspace number 1
assign [app_id="org.gnome.Calculator"] workspace number 1
assign [app_id="org.gnome.TextEditor"] workspace number 1
