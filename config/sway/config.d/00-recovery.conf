# Recovery defaults — load before other config.d snippets.
# Restores visible borders/title bars and reliable window close shortcuts.

default_border pixel 2
default_floating_border pixel 2

# If passthrough or resize mode was entered, reset on reload/login.
exec_always --no-startup-id swaymsg "mode default"

# Extra close shortcuts (Super = Mod4, Alt = Mod1).
bindsym Mod1+F4 kill
bindsym Mod4+Shift+Backspace kill
